<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Klearn 企画詳細</title>

  <style>
    @font-face {
      font-family: 'honoka';
      src: url('Honoka-Shin-Maru-Gothic_R.otf') format('opentype');
    }

    :root {
      --bg: #ffffff;
      --accent: #2563eb;
      --text: #111827;
      --card: #ffffff;
      --muted: #6b7280;
      --soft-border: #e5e7eb;
      --hero: #e5e7eb;
      --card-shadow: 0 14px 34px rgba(15, 23, 42, 0.08);
      --card-shadow-hover: 0 20px 40px rgba(0,0,0,0.15);
    }

    body.dark {
      --bg: #071026;
      --text: #d4e0ff;
      --accent: #4095ff;
      --card: #0f172a;
      --muted: #93a4c8;
      --soft-border: #334155;
      --hero: #111c35;
      --card-shadow: 0 14px 34px rgba(0, 0, 0, 0.20);
      --card-shadow-hover: 0 22px 46px rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: honoka, system-ui, -apple-system, Segoe UI, Roboto,
        "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background .3s, color .3s;
    }

    header {
      padding: 24px;
      position: absolute;
      z-index: 20;
    }

    .logo-area {
      position: relative;
      display: inline-block;
      z-index: 20;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      font-size: 16px;
    }

    .logo img {
      height: 40px;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 260px;
      background: #f9fafb;
      padding: 120px 24px 24px;
      box-shadow: 2px 0 10px rgba(0,0,0,0.08);
      transform: translateX(-100%);
      transition: transform .3s ease, background .3s;
      display: flex;
      flex-direction: column;
      z-index: 15;
    }

    body.dark .sidebar {
      background: #1e293b;
    }

    .logo-area:hover .sidebar {
      transform: translateX(0);
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
      margin: 0;
      flex: 1;
    }

    .sidebar li {
      margin-bottom: 16px;
    }

    .sidebar a {
      display: block;
      font-size: 18px;
      text-decoration: none;
      color: var(--text);
      padding: 8px 4px;
      border-radius: 8px;
      transition: background .15s;
    }

    .sidebar a:hover {
      background: rgba(37,99,235,0.08);
      color: var(--accent);
    }

    .theme-toggle {
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
    }

    body.dark .theme-toggle {
      border-top: 1px solid #334155;
    }

    .theme-toggle button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      background: var(--accent);
      color: white;
      font-weight: 600;
    }

    .hero {
      background: var(--hero);
      transition: background .3s;
    }

    .hero-inner,
    .main-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding-left: 32px;
      padding-right: 32px;
    }

    .hero-inner {
      padding-top: 34px;
      padding-bottom: 58px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 22px;
      padding: 10px 16px;
      border: 1px solid transparent;
      border-radius: 14px;
      color: var(--accent);
      text-decoration: none;
      font-size: 22px;
      line-height: 1.4;
      font-weight: 800;
      transition: background .15s, border-color .15s, box-shadow .15s, transform .15s;
    }

    .back-link:hover {
      background: var(--card);
      border-color: var(--soft-border);
      box-shadow: var(--card-shadow);
      transform: translateY(-1px);
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(46px, 7vw, 86px);
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: .01em;
    }

    .name {
      margin: 0 0 14px;
      font-size: 22px;
      font-weight: 800;
    }

    .tag-line {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 5px 14px;
      border: 2px solid var(--text);
      border-radius: 999px;
      color: var(--text);
      font-size: 16px;
      font-weight: 800;
      background: transparent;
    }

    .main-inner {
      padding-top: 58px;
      padding-bottom: 90px;
    }

    h2 {
      margin: 0 0 28px;
      font-size: clamp(38px, 5.4vw, 66px);
      line-height: 1.18;
      font-weight: 900;
      letter-spacing: .01em;
    }

    .info-card {
      max-width: 820px;
      background: var(--card);
      border: 1px solid var(--soft-border);
      border-radius: 20px;
      box-shadow: var(--card-shadow);
      padding: 28px 30px;
      margin-bottom: 40px;
      transition: background .3s, border-color .3s, box-shadow .25s;
    }

    .info-card:hover {
      box-shadow: var(--card-shadow-hover);
    }

    .info-row {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 6px;
      padding: 15px 0;
      border-bottom: 1px solid var(--soft-border);
      font-size: 20px;
      line-height: 1.7;
    }

    .info-row:first-child {
      padding-top: 0;
    }

    .info-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .info-label {
      font-weight: 900;
    }

    .body-text {
      max-width: 920px;
      font-size: 22px;
      line-height: 2.05;
      letter-spacing: .01em;
    }

    .body-text p {
      margin: 0 0 24px;
    }

    @media (max-width: 720px) {
      header {
        padding: 18px;
      }

      .hero-inner,
      .main-inner {
        padding-left: 20px;
        padding-right: 20px;
      }

      .hero-inner {
        padding-top: 26px;
        padding-bottom: 38px;
      }

      .back-link {
        font-size: 18px;
        margin-bottom: 18px;
      }

      .name {
        font-size: 19px;
      }

      .tag {
        min-height: 32px;
        font-size: 14px;
      }

      .main-inner {
        padding-top: 42px;
      }

      .info-card {
        padding: 22px;
      }

      .info-row {
        grid-template-columns: 1fr;
        font-size: 17px;
      }

      .body-text {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo-area">
      <a href="index.html" class="logo">
        <img src="logo-light.png" alt="Klearnロゴ" id="siteLogo">
        <span>Klearn</span>
      </a>

      <nav class="sidebar">
        <ul>
          <li><a href="home.html">ホーム</a></li>
          <li><a href="NPO.html">このNPOについて</a></li>
          <li><a href="index.html">パスワードを打つ</a></li>
          <li><a href="books.html">情報共有ページ</a></li>
        </ul>

        <div class="theme-toggle">
          <button id="themeBtn">DARK MODE</button>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-inner">
        <a class="back-link" href="shareid.html">← 情報共有ページへ戻る</a>
        <h1 id="projectTitleTop"></h1>
        <p class="name" id="projectOwner"></p>
        <div class="tag-line" id="projectTags"></div>
      </div>
    </section>

    <section class="main-inner">
      <h2 id="projectTitleBody"></h2>

      <div class="info-card">
        <div class="info-row">
          <div class="info-label">概要：</div>
          <div id="projectSummary"></div>
        </div>
        <div class="info-row">
          <div class="info-label">日時：</div>
          <div id="projectDate"></div>
        </div>
        <div class="info-row">
          <div class="info-label">推しポイント：</div>
          <div id="projectPoint"></div>
        </div>
      </div>

      <div class="body-text" id="projectBody"></div>
    </section>
  </main>

  <script>
    const project = {
      title: "企画名企画名企画名企画名…",
      owner: "名前",
      tags: ["タグ1", "タグ2", "タグ3"],
      summary: "テキストを挿入テキストを",
      date: "テキストを挿入テキストを",
      point: "テキストを挿入テキストを",
      body: [
        "内容内容内容…"
      ]
    };

    const btn = document.getElementById("themeBtn");
    const logo = document.getElementById("siteLogo");

    function updateLogo() {
      if (document.body.classList.contains("dark")) {
        btn.textContent = "LIGHT MODE";
        logo.src = "logo-dark.png";
      } else {
        btn.textContent = "DARK MODE";
        logo.src = "logo-light.png";
      }
    }

    btn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      updateLogo();
      localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    });

    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark");
    }

    document.getElementById("projectTitleTop").textContent = project.title;
    document.getElementById("projectTitleBody").textContent = project.title;
    document.getElementById("projectOwner").textContent = project.owner;
    document.getElementById("projectSummary").textContent = project.summary;
    document.getElementById("projectDate").textContent = project.date;
    document.getElementById("projectPoint").textContent = project.point;

    const tags = document.getElementById("projectTags");
    project.tags.forEach(tag => {
      const span = document.createElement("span");
      span.className = "tag";
      span.textContent = tag;
      tags.appendChild(span);
    });

    const body = document.getElementById("projectBody");
    project.body.forEach(text => {
      const p = document.createElement("p");
      p.textContent = text;
      body.appendChild(p);
    });

    updateLogo();
  </script>
</body>
</html>
