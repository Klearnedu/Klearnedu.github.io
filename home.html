<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Klearn</title>

<style>
@font-face {
  font-family: 'honoka';
  src: url('Honoka-Shin-Maru-Gothic_R.otf') format('opentype');
  font-weight: normal;
  font-style: normal;
}

:root{
  --bg:#ffffff;
  --accent:#2563eb;
  --text:#111827;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:honoka,system-ui,-apple-system,Segoe UI,Roboto,
    "Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  transition:background .3s,color .3s;
}

/* ダークテーマ */
body.dark{
  --bg:#071026;
  --text:#d4e0ff;
  --accent:#4095ff;
}

/* ヘッダー */
header{
  padding:24px;
}

/* ロゴエリア */
.logo-area{
  position:relative;
  display:inline-block;
}

/* ロゴ */
.logo{
  display:inline-flex;
  align-items:center;
  gap:8px;
  text-decoration:none;
  color:var(--text);
  font-weight:600;
  font-size:16px;
}

.logo img{
  height:40px;
  width:auto;
  display:block;
}

/* サイドバー */
.sidebar{
  position:fixed;
  top:0;
  left:0;
  height:100vh;
  width:260px;
  background:#f9fafb;
  padding:120px 24px 24px;
  box-shadow:2px 0 10px rgba(0,0,0,0.08);
  transform:translateX(-100%);
  transition:transform 0.3s ease, background .3s;
  display:flex;
  flex-direction:column;
}

body.dark .sidebar{
  background:#1e293b;
}

.logo-area:hover .sidebar{
  transform:translateX(0);
}

.sidebar ul{
  list-style:none;
  padding:0;
  margin:0;
  flex:1;
}

.sidebar li{
  margin-bottom:16px;
}

.sidebar a{
  display:block;
  font-size:18px;
  text-decoration:none;
  color:var(--text);
  padding:8px 4px;
  border-radius:8px;
  transition:background .15s;
}

.sidebar a:hover{
  background:rgba(37,99,235,0.08);
  color:var(--accent);
}

/* トグルボタン */
.theme-toggle{
  padding-top:20px;
  border-top:1px solid #e5e7eb;
}

body.dark .theme-toggle{
  border-top:1px solid #334155;
}

.theme-toggle button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
  background:var(--accent);
  color:white;
  font-weight:600;
  transition:opacity .15s;
}

.theme-toggle button:hover{
  opacity:0.85;
}

/* メイン */
main{
  padding-top:80px;
  padding-bottom:80px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

/* タイトル */
h1{
  font-size:64px;
  font-weight:800;
  margin:0 0 24px;
}

.k{
  font-size:90px;
  font-weight:900;
  color:var(--accent);
}

/* 理念 */
.philosophy{
  max-width:700px;
  font-size:20px;
  line-height:1.8;
  color:#374151;
  margin-bottom:60px;
  font-weight:bold;
}

body.dark .philosophy{
  color:#cbd5e1;
}

/* メニュー */
ul{
  list-style:none;
  padding:0;
  margin:0;
}

li{
  margin:20px 0;
}

a.menu-link{
  font-size:28px;
  font-weight:600;
  text-decoration:none;
  color:var(--accent);
  padding:8px 16px;
  border-radius:10px;
  transition:background .15s;
}

a.menu-link:hover{
  background:rgba(37,99,235,0.08);
}

/* 情報共有ページへのリンクボックス */
.share-box{
  margin-top:40px;
  padding:26px 48px;
  border:2px solid var(--accent);
  border-radius:22px;
  background:rgba(37,99,235,0.06);
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  transition:background .15s, transform .15s;
}

.share-box:hover{
  background:rgba(37,99,235,0.12);
  transform:translateY(-2px);
}

.share-box a{
  display:block;
  font-size:28px;
  font-weight:800;
  text-decoration:none;
  color:var(--accent);
}
  
/* スマホ対応 */
@media (max-width:600px){
  h1{
    font-size:48px;
  }

  .k{
    font-size:70px;
  }

  .philosophy{
    font-size:17px;
    padding:0 20px;
  }

  a.menu-link{
    font-size:22px;
  }

  .share-box{
    width:calc(100% - 40px);
    padding:16px 20px;
  }

  .share-box a{
    font-size:20px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo-area">
    <a href="index.html" class="logo">
      <img src="logo-light.png" alt="logo" id="siteLogo">
      <span>サイドバーを表示</span>
    </a>

    <nav class="sidebar">
      <ul>
        <li><a href="home.html">ホーム</a></li>
        <li><a href="NPO.html">このNPOについて</a></li>
        <li><a href="index.html">パスワード画面に戻る</a></li>
        <li><a href="aaaaaaaaaaaaaaaaaaaaaaaaa.html">ここにテキストを挿入ここにテキストを挿入ここにテキストを挿入</a></li>
      </ul>

      <div class="theme-toggle">
        <button id="themeBtn">DARK MODE</button>
      </div>
    </nav>
  </div>
</header>

<main>
  <h1>
    <span class="k">K</span>learn
  </h1>

  <p class="philosophy">
    学びをもっと自由に、仲間と共に。<br>
    Klearnは、あなたのアイディアを世界に届けます。
  </p>

  <ul>
    <li>
      <a class="menu-link" href="manage.html">
        ・管理履歴
      </a>
    </li>
    <li>
      <a class="menu-link" href="thisnpo.html">
        ・このNPOについて
      </a>
    </li>
    <li>
      <a class="menu-link" href="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.html">
        ・ここにテキストを挿入ここにテキストを挿入ここにテキスト
      </a>
    </li>
  </ul>

  <div class="share-box">
    <a href="shareid.html">情報共有ページへ飛ぶ</a>
  </div>
</main>

<script>
const btn = document.getElementById("themeBtn");
const logo = document.getElementById("siteLogo");

btn.addEventListener("click", () => {
  document.body.classList.toggle("dark");

  if(document.body.classList.contains("dark")){
    btn.textContent = "LIGHT MODE";
    logo.src = "logo-dark.png";
  } else {
    btn.textContent = "DARK MODE";
    logo.src = "logo-light.png";
  }
});
</script>

</body>
</html>
